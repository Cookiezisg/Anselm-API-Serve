# Production deploy: build on GitHub, transfer through a pinned SSH channel, then
# perform a traffic-blocked, schema-aware state transition on the VPS.
#
# Required GitHub Environment (`production`) secrets:
#   SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER, SERVER_KNOWN_HOSTS
#   DEEPSEEK_API_KEY, DASHSCOPE_API_KEY, DASHSCOPE_WORKSPACE_ID, MEDIA_SIGNING_SECRET,
#   GATEWAY_DOMAIN, ACME_EMAIL, MEDIA_DOMAIN
# Optional secrets:
#   DASHBOARD_AUTH_MODE (disabled|builtin|external; external for a preceding IAP)
#   DASHBOARD_USER + DASHBOARD_PASSWORD (required only for builtin)
#   SITE_DOMAIN (otherwise derived from api.<root>)
#
# MEDIA_DOMAIN is the PUBLIC host an upstream fetches a media lease from. It MUST NOT be an
# `api.` name: ADR 0012's production experiment proved the fetcher blacklists API-shaped hosts at
# its own edge (three 400s while the origin log showed no request ever arrived). render-caddy.sh
# refuses an api.* value for that reason.
#
# SERVER_KNOWN_HOSTS is mandatory. There is deliberately no ssh-keyscan/TOFU
# fallback: the production host identity must be pinned out of band.

name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # This is intentionally not part of ordinary deployment.  It is a one-time
  # escape hatch for an explicitly confirmed, pre-launch clean-slate release.
  workflow_dispatch:
    inputs:
      reset_unlaunched_gateway_data:
        description: "Delete the unlaunched gateway SQLite database before deployment"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "Type RESET_UNLAUNCHED_GATEWAY_DATA to authorize deletion"
        required: true
        type: string

permissions:
  contents: read

# Never cancel a state transition after it has started. The remote installer also
# has an EXIT/signal trap, but serialization avoids needless rollback pressure.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  admission:
    # workflow_run can expose production secrets, so accept only the repository's
    # own successful push-to-main CI run. This job has no production environment
    # or secrets: a stale completed CI run is a normal race, not a failed deploy.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.reset_unlaunched_gateway_data == true &&
       inputs.confirmation == 'RESET_UNLAUNCHED_GATEWAY_DATA')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.main-tip.outputs.deploy }}
    steps:
      # This checkout executes no repository code; it only configures the
      # repository-scoped token for the authenticated ls-remote below.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: admit only the current main SHA
        id: main-tip
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'workflow_run head_sha is not a full lowercase commit SHA' >&2
            exit 1
          }
          main_tip="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          [[ "${main_tip}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'could not resolve the current main tip' >&2
            exit 1
          }
          if [[ "${main_tip}" != "${DEPLOY_SHA}" ]]; then
            echo "::notice::skipping stale CI SHA ${DEPLOY_SHA}; main is now ${main_tip}"
            echo 'deploy=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'deploy=true' >>"${GITHUB_OUTPUT}"

  build-test-deploy:
    needs: admission
    if: needs.admission.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/infra/webassets/ui/package-lock.json

      # CI success is the admission gate. These checks intentionally run again on
      # the exact checked-out SHA as defense in depth before production mutation.
      - name: gofmt (no diff)
        run: |
          out="$(gofmt -l .)"
          if [[ -n "${out}" ]]; then
            echo "::error::gofmt would reformat:"
            echo "${out}"
            exit 1
          fi

      - name: module checksum verification
        run: go mod verify

      - name: vet + build all packages
        run: |
          go vet ./...
          go build ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      - name: integration e2e (race)
        run: go test -tags=integration -race -count=1 ./internal/e2e/...

      - name: fuzz smoke (public parsers)
        run: |
          set -euo pipefail
          go test -run '^$' -fuzz '^FuzzDecodeInbound$' -fuzztime=30s ./internal/domain/chat/
          go test -run '^$' -fuzz '^FuzzIPKey$' -fuzztime=30s ./internal/pkg/clientip/
          go test -run '^$' -fuzz '^FuzzVerify$' -fuzztime=30s ./internal/pkg/pow/

      - name: coverage thresholds (money packages)
        run: |
          set -euo pipefail
          check() {
            local pkg="$1" min="$2" pct
            pct="$(go test -cover "$pkg" 2>/dev/null \
              | sed -nE 's/.*coverage: ([0-9.]+)% of statements.*/\1/p')"
            [[ -n "${pct}" ]] || { echo "::error::could not read coverage for ${pkg}"; exit 1; }
            echo "coverage ${pkg} = ${pct}% (min ${min}%)"
            awk -v c="${pct}" -v m="${min}" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
              || { echo "::error::${pkg} coverage ${pct}% below ${min}%"; exit 1; }
          }
          check ./internal/app/quota/... 70
          check ./internal/app/chat/...  65
          # The generation capabilities, kept in step with ci.yml. This gate runs on the path that
          # actually reaches production, so it must not check LESS than the PR gate does.
          check ./internal/app/image/...   70
          check ./internal/app/tts/...     70
          check ./internal/app/video/...   70
          check ./internal/domain/video/... 90
          check ./internal/app/voice/...   70

      - name: docs governance
        run: make docs

      - name: deploy scripts syntax + failure propagation
        run: |
          bash -n deploy/*.sh
          bash deploy/build_stage_test.sh
          bash deploy/rollback_test.sh

      - name: frontend embedded-dist drift guard
        working-directory: internal/infra/webassets/ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          git diff --exit-code -- dist || {
            echo "::error::dashboard dist drifted from source"
            exit 1
          }
          status="$(git status --porcelain --untracked-files=all -- dist)"
          if [[ -n "${status}" ]]; then
            echo "${status}"
            echo "::error::dashboard build produced uncommitted dist files"
            exit 1
          fi

      - name: golangci-lint (including depguard)
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.6.1

      - name: govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4

      - name: build linux/amd64 (static; dashboard dist embedded)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o anselm-gateway ./cmd/gateway

      - name: resolve version
        id: ver
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'workflow_run head_sha is not a full lowercase commit SHA' >&2
            exit 1
          }
          echo "sha=${DEPLOY_SHA:0:12}" >>"${GITHUB_OUTPUT}"

      - name: deploy through pinned SSH (schema-aware auto-rollback)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          DASHBOARD_AUTH_MODE: ${{ secrets.DASHBOARD_AUTH_MODE }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GATEWAY_DOMAIN: ${{ secrets.GATEWAY_DOMAIN }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          MEDIA_DOMAIN: ${{ secrets.MEDIA_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          RESET_UNLAUNCHED_GATEWAY_DATA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY is required}"
          : "${SERVER_HOST:?SERVER_HOST is required}"
          : "${SERVER_USER:?SERVER_USER is required}"
          : "${SERVER_KNOWN_HOSTS:?SERVER_KNOWN_HOSTS is required; pin the production host key}"
          [[ "${SERVER_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'invalid SERVER_HOST' >&2; exit 1; }
          [[ "${SERVER_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'invalid SERVER_USER' >&2; exit 1; }
          [[ "${SERVER_KNOWN_HOSTS}" != *$'\r'* ]] || { echo 'SERVER_KNOWN_HOSTS contains CR' >&2; exit 1; }

          LOCAL_ROOT="$(mktemp -d "${RUNNER_TEMP}/anselm-deploy.XXXXXXXXXX")"
          LOCAL_STAGE="${LOCAL_ROOT}/stage"
          SSH_KEY="${LOCAL_ROOT}/id_deploy"
          KNOWN_HOSTS="${LOCAL_ROOT}/known_hosts"
          REMOTE_STAGE=''
          DEST=''
          SSH_OPTS=()

          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            if [[ -n "${DEST}" && -n "${REMOTE_STAGE}" && "${REMOTE_STAGE}" =~ ^/tmp/anselm-deploy\.[A-Za-z0-9]{10}$ ]]; then
              ssh "${SSH_OPTS[@]}" "${DEST}" bash -s -- "${REMOTE_STAGE}" <<'CLEAN_REMOTE' >/dev/null 2>&1 || true
          set -euo pipefail
          stage="$1"
          [[ "${stage}" =~ ^/tmp/anselm-deploy\.[A-Za-z0-9]{10}$ ]] || exit 1
          with_deploy_lock() {
            sudo -n bash -c '
              lock_dir="$1"
              shift
              if [[ -e "$lock_dir" || -L "$lock_dir" ]]; then
                [[ -d "$lock_dir" && ! -L "$lock_dir" ]]
                [[ "$(stat -c "%u:%g:%a" "$lock_dir")" == 0:0:700 ]]
              else
                install -d -o root -g root -m 0700 "$lock_dir"
              fi
              lock="$lock_dir/lock"
              if [[ -e "$lock" || -L "$lock" ]]; then
                [[ -f "$lock" && ! -L "$lock" ]]
                [[ "$(stat -c "%u:%g:%a" "$lock")" == 0:0:600 ]]
              else
                install -o root -g root -m 0600 /dev/null "$lock"
              fi
              exec 9<>"$lock"
              flock -n 9
              exec "$@"
            ' _ /run/anselm-gateway-deploy "$@"
          }
          if ! with_deploy_lock bash -c '
            set -euo pipefail
            stage="$1"
            [[ "$stage" =~ ^/tmp/anselm-deploy\.[A-Za-z0-9]{10}$ ]]
            [[ ! -e "$stage" || -d "$stage" && ! -L "$stage" ]]
            chmod -R u+rwX "$stage" >/dev/null 2>&1 || true
            rm -rf -- "$stage"
          ' _ "${stage}"; then
            if ! sudo -n test -e "${stage}/.installer-active"; then
              sudo -n chmod -R u+rwX "${stage}" >/dev/null 2>&1 || true
              sudo -n rm -rf -- "${stage}" >/dev/null 2>&1 || {
                chmod -R u+rwX "${stage}" >/dev/null 2>&1 || true
                rm -rf -- "${stage}" || true
              }
            fi
          fi
          CLEAN_REMOTE
            fi
            rm -rf -- "${LOCAL_ROOT}"
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          chmod 0700 "${LOCAL_ROOT}"
          mkdir -m 0700 "${LOCAL_STAGE}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${SSH_KEY}"
          printf '%s\n' "${SERVER_KNOWN_HOSTS}" >"${KNOWN_HOSTS}"
          chmod 0600 "${SSH_KEY}" "${KNOWN_HOSTS}"
          ssh-keygen -l -f "${KNOWN_HOSTS}" >/dev/null
          ssh-keygen -F "${SERVER_HOST}" -f "${KNOWN_HOSTS}" >/dev/null || {
            echo 'SERVER_KNOWN_HOSTS has no entry for SERVER_HOST' >&2
            exit 1
          }

          DEST="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTS=(
            -i "${SSH_KEY}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${KNOWN_HOSTS}"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ConnectTimeout=15
          )

          bash deploy/build-stage.sh "${LOCAL_STAGE}" "${GITHUB_WORKSPACE}/anselm-gateway" "${GITHUB_WORKSPACE}"
          MANIFEST_SHA="$(sha256sum "${LOCAL_STAGE}/manifest.sha256" | awk '{print $1}')"
          [[ "${MANIFEST_SHA}" =~ ^[0-9a-f]{64}$ ]]

          REMOTE_STAGE="$(ssh "${SSH_OPTS[@]}" "${DEST}" \
            'set -e; umask 077; d=$(mktemp -d /tmp/anselm-deploy.XXXXXXXXXX); chmod 0700 "$d"; printf "%s" "$d"')"
          [[ "${REMOTE_STAGE}" =~ ^/tmp/anselm-deploy\.[A-Za-z0-9]{10}$ ]] || {
            echo 'remote mktemp returned an unsafe path' >&2
            exit 1
          }

          # Every byte, including the secret EnvironmentFile, enters one
          # unpredictable 0700 directory. The remote entrypoint checks exact file
          # set, regular/no-symlink ownership, manifest hash, and every artifact
          # hash before it executes the installer.
          scp "${SSH_OPTS[@]}" -r "${LOCAL_STAGE}/." "${DEST}:${REMOTE_STAGE}/"
          ssh "${SSH_OPTS[@]}" "${DEST}" bash -s -- "${REMOTE_STAGE}" "${MANIFEST_SHA}" \
            <deploy/remote-entrypoint.sh
